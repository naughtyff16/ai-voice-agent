; =====================================================================
; Phase 5K — Alembic configuration
;
; This Alembic package is an INTEGRATION LAYER over the canonical,
; frozen SQL migration package at 5K/migrations/001-075. It does not
; autogenerate schema, does not own the schema definition, and must
; never be pointed at the ORM metadata to "diff" the database. Each
; Alembic revision under versions/ is a thin wrapper that executes
; exactly one frozen *.sql file, unmodified, via op.execute().
;
; No credentials are stored here. sqlalchemy.url is intentionally
; left blank — env.py builds the connection URL exclusively from the
; DATABASE_URL environment variable at runtime and raises if it is
; unset.
; =====================================================================

[alembic]
# Path to migration scripts. Alembic is invoked with -c pointing at
# this file from the 5K/alembic directory, so "." resolves here; the
# default versions directory (script_location/versions) is used, i.e.
# 5K/alembic/versions/, one file per frozen SQL migration
# (001_5B.py .. 075_5J.py), named after the SQL file it wraps.
script_location = .

# Template used by `alembic revision`. New non-5K revisions (post-075)
# may use this normally; revisions 001-075 were generated once by the
# 5K integration script, not by `alembic revision --autogenerate`.
prepend_sys_path = .

# Timezone-free numeric revision file naming; content is what matters,
# not the filename, since revision ids are explicit in each script.
truncate_slug_length = 40

# No autogenerate target — see env.py: target_metadata = None.
# This deliberately prevents `alembic revision --autogenerate` from
# ever proposing a competing schema history.

version_path_separator = os

# Do NOT set sqlalchemy.url here. DATABASE_URL (env var) is the single
# source of truth; see env.py get_url(). Leaving this blank/absent is
# intentional, not an oversight — it is what keeps credentials out of
# committed configuration.
# sqlalchemy.url =

[post_write_hooks]
# none configured

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

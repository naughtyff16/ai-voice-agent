[project]
name = "voice-agent-backend"
version = "0.1.0"
description = "AI Voice Agent Platform backend (modular monolith)."
readme = "README.md"
# One runtime everywhere: local, tests, container (python:3.12-slim, 3F §3.1) and CI.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "redis>=5.2,<8",
    "structlog>=24.4",
    # Process manager and worker class for the container entrypoint (3F §3.1).
    # uvicorn-worker replaces the deprecated uvicorn.workers module. Neither runs
    # on Windows, where local development uses uvicorn directly.
    "gunicorn>=23,<26; sys_platform != 'win32'",
    "uvicorn-worker>=0.3,<1; sys_platform != 'win32'",
]

[dependency-groups]
# Operator/CI tooling for the frozen Alembic package. Never part of the API image.
migrations = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]
dev = [
    { include-group = "migrations" },
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.28,<1",
    "ruff>=0.8",
    "mypy>=1.13,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # security (bandit rules)
    "T20",          # print() is banned (CODING_STANDARDS, 3A §12.4)
    "ASYNC",        # blocking calls in async code
    "BLE",          # blind except
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; test harness code launches local server binaries.
"tests/**" = ["S101", "S603", "S607"]
# Operator CLIs launch alembic/ruff/mypy/pytest as subprocesses by design, and
# stdout is their user interface (application code still may not print).
"scripts/**" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["voice_agent", "scripts", "tests"]
# Teaches mypy pydantic's generated __init__ signatures, including the
# BaseSettings loader arguments such as _env_file.
plugins = ["pydantic.mypy"]

# asyncpg ships neither inline types nor a py.typed marker. Only its exception
# classes are referenced directly (db/session.py); everything else goes through
# SQLAlchemy, which is fully typed.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: no external process or network; may use test doubles",
    "integration: runs against real, disposable PostgreSQL 18 and Redis",
    "smoke: boots the real application against real dependencies",
]
filterwarnings = ["error"]
